# experiments/exp_arcs/cost_harm_spec.yaml — ARCS action cost / reversibility /
# harm model (Step 1.3), FROZEN 2026-09-15.
#
# A "repair action" regenerates the evidence for a contaminated node by
# re-running a tool / source family (or, at the coarse end, replaying the whole
# run). ARCS chooses a repair SCOPE = a set of nodes to re-run under cost / harm
# / reversibility / budget constraints (Phase 2+). This table is the frozen
# input; a run records its own sha256 (see cost_harm.py::spec_version_hash).
#
#   c(v) cost         — relative units (plan anchors: dns=1, http=3,
#                       deep-search=5, full-replay=20)
#   r(v) reversibility — idempotent < reversible < compensatable < irreversible
#   h(v) harm         — per-action harm weight (0 = benign read-only recon)
spec_version: arcs-cost-harm-v1

reversibility_rank:
  idempotent: 0
  reversible: 1
  compensatable: 2
  irreversible: 3

actions:
  dns_resolve:   {cost: 1,  reversibility: idempotent,    harm: 0}
  cert_lookup:   {cost: 1,  reversibility: idempotent,    harm: 0}
  rdap_query:    {cost: 1,  reversibility: idempotent,    harm: 0}
  subfinder:     {cost: 2,  reversibility: idempotent,    harm: 0}
  http_probe:    {cost: 3,  reversibility: idempotent,    harm: 1}
  nmap_scan:     {cost: 5,  reversibility: idempotent,    harm: 3}
  cve_rag:       {cost: 5,  reversibility: reversible,    harm: 0}   # deep-search
  cache_rebuild: {cost: 8,  reversibility: reversible,    harm: 0}
  testbed_write: {cost: 10, reversibility: compensatable, harm: 5}
  prod_config:   {cost: 15, reversibility: irreversible,  harm: 20}
  # full_replay = replay-the-run FROM CACHE (reproduce). NOTE: this reproduces the
  # existing (possibly faulted) output — it is NOT a repair action and is NOT the
  # repair-cost baseline. The repair baseline is global RE-COLLECTION, costed by
  # dag.scope_cost() over all repairable leaves at (target, family) invocation
  # grain (≈360 on mozilla, not 20). Families mapping to full_replay
  # (llm_inference / system_diagnostic / other) are derived and NOT repairable
  # leaves (dag.py sets repairable=False for them).
  full_replay:   {cost: 20, reversibility: reversible,    harm: 0}

# Which repair action regenerates a node, keyed by its evidence source_family.
# (Claims/decisions/report_items inherit the action of their supporting
# evidence; the DAG builder resolves this — see dag.py.)
family_to_action:
  dns: dns_resolve
  certificate: cert_lookup
  registration: rdap_query
  active_observation: http_probe
  vulnerability_context: cve_rag
  temporal_memory: cache_rebuild
  llm_inference: full_replay
  applicability_validation: cve_rag
  passive_observation: subfinder
  system_diagnostic: full_replay
  other: full_replay
