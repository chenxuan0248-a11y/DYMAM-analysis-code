[tool.poetry]
package-mode = false
name = "dymam"
version = "0.1.0"
description = "Dynamic Multi-Agent Asset Mapping"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
license = "MIT"

[tool.poetry.dependencies]
python = "^3.12"
langgraph = "^0.2"
langchain = "^0.3"
langchain-core = "^0.3"
langchain-community = "^0.3"
langchain-litellm = "^0.1"
neo4j = "^5.20"
qdrant-client = "^1.10"
duckdb = "^1.0"
redis = "^5.0"
sentence-transformers = "^3.0"
fastapi = "^0.110"
uvicorn = "^0.30"
websockets = "^12.0"
streamlit = "^1.40"
streamlit-agraph = "^0.0.45"
pyvis = "^0.3.2"
plotly = "^5.20"
pandas = "^2.2"
pyarrow = "^18.1"
numpy = "^1.26"
scipy = "^1.13"
dnspython = "^2.6"
requests = "^2.32"
psycopg2-binary = "^2.9"
pydantic = "^2.7"
pydantic-settings = "^2.4"
jsonschema = "^4.23"
matplotlib = "^3.9"
python-dotenv = "^1.0"
tqdm = "^4.66"
loguru = "^0.7"
mmh3 = "^5.2.1"
maxminddb = "^3.1.1"
rank-bm25 = "^0.2.2"
pulp = "^3.3.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-cov = "^5.0"
black = "^24.4"
ruff = "^0.5"
jupyter = "^1.0"

[tool.pytest.ini_options]
markers = [
    "docker: requires access to the local Docker daemon",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
